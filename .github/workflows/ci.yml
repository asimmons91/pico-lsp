name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Race test
        run: go test -count=1 -race ./...

      - name: Static build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/pico-lsp

  fuzz:
    name: short fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Fuzz lexer
        run: go test -fuzz=FuzzLexer -fuzztime=5s ./internal/syntax

      - name: Fuzz parser
        run: go test -fuzz=FuzzParser -fuzztime=5s ./internal/syntax

      - name: Fuzz include flattening
        run: go test -fuzz=FuzzIncludeFlatten -fuzztime=5s ./internal/cart
