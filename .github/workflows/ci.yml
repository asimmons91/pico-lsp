name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel
          - windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Race test
        if: runner.os == 'Linux'
        run: go test -count=1 -race ./...

      - name: Coverage
        if: runner.os == 'Linux'
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

      - name: Lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Vulnerability scan
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Formatter performance
        if: runner.os == 'Linux'
        env:
          PICO_LSP_PERF: "1"
        run: go test -count=1 -run TestFormatPerformance -p 1 ./internal/format

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos:
          - linux
          - darwin
          - windows
        goarch:
          - amd64
          - arm64
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -trimpath ./cmd/pico-lsp

  fuzz:
    name: short fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Fuzz lexer
        run: go test -fuzz=FuzzLexer -fuzztime=10s ./internal/syntax

      - name: Fuzz parser
        run: go test -fuzz=FuzzParser -fuzztime=30s ./internal/syntax

      - name: Fuzz include flattening
        run: go test -fuzz=FuzzIncludeFlatten -fuzztime=10s ./internal/cart

      - name: Fuzz analysis
        run: go test -fuzz=FuzzAnalyze -fuzztime=10s ./internal/analysis

      - name: Fuzz formatter
        run: go test -run=^$ -fuzz=FuzzFormatLua -fuzztime=10s ./internal/format

  release-snapshot:
    name: release snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate goreleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.2
          args: check

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.2
          args: release --snapshot --clean

      - name: Verify snapshot archives
        shell: bash
        run: |
          set -euo pipefail
          for archive in dist/pico-lsp_*_linux_*.tar.gz dist/pico-lsp_*_darwin_*.tar.gz; do
            for entry in pico-lsp README.md LICENSE CHANGELOG.md; do
              tar -tzf "$archive" | grep -qx "$entry"
            done
          done
          for archive in dist/pico-lsp_*_windows_*.zip; do
            for entry in pico-lsp.exe README.md LICENSE CHANGELOG.md; do
              unzip -Z1 "$archive" | grep -qx "$entry"
            done
          done
          (cd dist && sha256sum -c checksums.txt)
