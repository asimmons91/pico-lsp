name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly

jobs:
  release:
    name: test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up mise tools
        uses: jdx/mise-action@v5

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Race test
        run: go test -count=1 -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Validate VS Code extension version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./editors/vscode/package.json').version")"
          test "$manifest" = "$version"

      - name: Install VS Code extension dependencies
        run: npm ci
        working-directory: editors/vscode

      - name: Build extension test server
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-X github.com/asimmons91/pico-lsp/internal/version.Version=${version}" -o /tmp/pico-lsp ./cmd/pico-lsp

      - name: Test VS Code extension
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm run test:unit
          xvfb-run -a env PICO_LSP_TEST_SERVER=/tmp/pico-lsp npm run test:integration
        working-directory: editors/vscode

      - name: Package VS Code extension
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm run package
          (
            cd ../..
            sha256sum "pico-lsp-vscode-${version}.vsix" > "pico-lsp-vscode-${version}.vsix.sha256"
          )
        working-directory: editors/vscode

      - name: Verify VSIX contents
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="pico-lsp-vscode-${version}.vsix"
          for entry in \
            extension/dist/extension.js \
            extension/syntaxes/pico8.tmLanguage.json \
            extension/language-configuration.json \
            extension/readme.md \
            extension/changelog.md \
            extension/LICENSE.txt \
            extension/icons/pico-lsp.png; do
            unzip -Z1 "$archive" | grep -qx "$entry"
          done
          for pattern in \
            '^extension/src/' \
            '^extension/test/' \
            '^extension/scripts/' \
            '^extension/images/' \
            '^extension/icons/README.md$' \
            '^extension/icons/pico8\.png$' \
            '^extension/.*\.map$'; do
            if unzip -Z1 "$archive" | grep -qE "$pattern"; then
              echo "VSIX contains excluded path matching $pattern" >&2
              exit 1
            fi
          done

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-vsix
          path: |
            pico-lsp-vscode-*.vsix
            pico-lsp-vscode-*.vsix.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Validate version injection
        shell: bash
        run: |
          go build -trimpath -ldflags "-X github.com/asimmons91/pico-lsp/internal/version.Version=${GITHUB_REF_NAME#v}" -o /tmp/pico-lsp ./cmd/pico-lsp
          test "$(/tmp/pico-lsp --version)" = "$GITHUB_REF_NAME"

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload VS Code extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "pico-lsp-vscode-${version}.vsix" \
            "pico-lsp-vscode-${version}.vsix.sha256" \
            --clobber

      - name: Verify released assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          work="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" --dir "$work"
          (cd "$work" && sha256sum -c checksums.txt)
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              test -f "$work/pico-lsp_${version}_${os}_${arch}.tar.gz" ||
                test -f "$work/pico-lsp_${version}_${os}_${arch}.zip"
            done
          done
          test -f "$work/pico-lsp-vscode-${version}.vsix"
          test -f "$work/pico-lsp-vscode-${version}.vsix.sha256"
          (cd "$work" && sha256sum -c "pico-lsp-vscode-${version}.vsix.sha256")
          tar -xzf "$work/pico-lsp_${version}_linux_amd64.tar.gz" -C "$work"
          test "$("$work/pico-lsp" --version)" = "$GITHUB_REF_NAME"

  publish-marketplace:
    name: publish marketplace
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up mise tools
        uses: jdx/mise-action@v5

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: vscode-vsix
          path: vsix

      - name: Validate VSIX and extension version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./editors/vscode/package.json').version")" = "$version"
          test -f "vsix/pico-lsp-vscode-${version}.vsix"
          (cd vsix && sha256sum -c "pico-lsp-vscode-${version}.vsix.sha256")

      - name: Require Marketplace token
        shell: bash
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "::error::VSCE_PAT is not configured. See docs/release-checklist.md."
            exit 1
          fi

      - name: Publish to VS Code Marketplace
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npx --yes @vscode/vsce@4.1.1 publish \
            --packagePath "vsix/pico-lsp-vscode-${version}.vsix" \
            --pat "${VSCE_PAT}" \
            --skip-duplicate

  publish-openvsx:
    name: publish open vsx
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up mise tools
        uses: jdx/mise-action@v5

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: vscode-vsix
          path: vsix

      - name: Validate VSIX and extension version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./editors/vscode/package.json').version")" = "$version"
          test -f "vsix/pico-lsp-vscode-${version}.vsix"
          (cd vsix && sha256sum -c "pico-lsp-vscode-${version}.vsix.sha256")

      - name: Require Open VSX token
        shell: bash
        run: |
          if [ -z "${OVSX_PAT}" ]; then
            echo "::error::OVSX_PAT is not configured. See docs/release-checklist.md."
            exit 1
          fi

      - name: Publish to Open VSX
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npx --yes ovsx@1.4.0 publish \
            "vsix/pico-lsp-vscode-${version}.vsix" \
            --pat "${OVSX_PAT}" \
            --skip-duplicate
