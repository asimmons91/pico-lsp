name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly

jobs:
  release:
    name: test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up mise tools
        uses: jdx/mise-action@v5

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Race test
        run: go test -count=1 -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Validate VS Code extension version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./editors/vscode/package.json').version")"
          test "$manifest" = "$version"

      - name: Install VS Code extension dependencies
        run: npm ci
        working-directory: editors/vscode

      - name: Build extension test server
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-X github.com/asimmons91/pico-lsp/internal/version.Version=${version}" -o /tmp/pico-lsp ./cmd/pico-lsp

      - name: Test VS Code extension
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm run test:unit
          xvfb-run -a env PICO_LSP_TEST_SERVER=/tmp/pico-lsp npm run test:integration
        working-directory: editors/vscode

      - name: Package VS Code extension
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm run package
          (
            cd ../..
            sha256sum "pico-lsp-vscode-${version}.vsix" > "pico-lsp-vscode-${version}.vsix.sha256"
          )
        working-directory: editors/vscode

      - name: Validate version injection
        shell: bash
        run: |
          go build -trimpath -ldflags "-X github.com/asimmons91/pico-lsp/internal/version.Version=${GITHUB_REF_NAME#v}" -o /tmp/pico-lsp ./cmd/pico-lsp
          test "$(/tmp/pico-lsp --version)" = "$GITHUB_REF_NAME"

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload VS Code extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "pico-lsp-vscode-${version}.vsix" \
            "pico-lsp-vscode-${version}.vsix.sha256" \
            --clobber

      - name: Verify released assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          work="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" --dir "$work"
          (cd "$work" && sha256sum -c checksums.txt)
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              test -f "$work/pico-lsp_${version}_${os}_${arch}.tar.gz" ||
                test -f "$work/pico-lsp_${version}_${os}_${arch}.zip"
            done
          done
          test -f "$work/pico-lsp-vscode-${version}.vsix"
          test -f "$work/pico-lsp-vscode-${version}.vsix.sha256"
          (cd "$work" && sha256sum -c "pico-lsp-vscode-${version}.vsix.sha256")
          tar -xzf "$work/pico-lsp_${version}_linux_amd64.tar.gz" -C "$work"
          test "$("$work/pico-lsp" --version)" = "$GITHUB_REF_NAME"
