name: Nightly fuzz

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: nightly fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Fuzz lexer
        run: go test -fuzz=FuzzLexer -fuzztime=60s ./internal/syntax

      - name: Fuzz parser
        run: go test -fuzz=FuzzParser -fuzztime=60s ./internal/syntax

      - name: Fuzz include flattening
        run: go test -fuzz=FuzzIncludeFlatten -fuzztime=60s ./internal/cart

      - name: Fuzz analysis
        run: go test -fuzz=FuzzAnalyze -fuzztime=60s ./internal/analysis

      - name: Fuzz formatter
        run: go test -run=^$ -fuzz=FuzzFormatLua -fuzztime=60s ./internal/format

      - name: Fuzz PNG decoder
        run: go test -run=^$ -fuzz=FuzzDecode -fuzztime=60s ./internal/p8png
